<!DOCTYPE html>
<html>
<head>
    <title>HM11</title>
</head>
<body>

<h1>Question 1: Guess Number</h1>
<button onclick="guessNum()">Start Game</button>

<hr>

<h1>Question 2: Array</h1>

<input type="text" id="inputBox">
<button onclick="addItem()">Add</button>
<button onclick="displayItems()">Display</button>
<p id="result"></p>

<script>
    function guessNum() {
        var randomNumber = Math.floor(Math.random() * 10) + 1;
        var guess = prompt("Guess a number between 1 and 10:");
        guess = Number(guess);

        if (guess === randomNumber) {
            alert("Good Work");
        } else {
            alert("Not matched. The number was: " + randomNumber);
        }
    }

  
    var array = [];

    function addItem() {
        var value = document.getElementById("inputBox").value;
        array.push(value);
        document.getElementById("inputBox").value = "";
    }

    function displayItems() {
        var output = "";
        for (var i = 0; i < array.length; i++) {
            output += "Element " + (i + 1) + " = " + array[i] + "<br>";
        }
        document.getElementById("result").innerHTML = output;
    }
</script>

</body>
</html>
