<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid System HM </title>
<link rel="stylesheet" href="styleforgrid.css">
</head>
<body>
<div class="grid">

<div class="card hero">
<h1>Golden Dunes,<br>Silent Sands</h1>
<p>The desert is a world of warmth, stillness and endless horizons.</p>
</div>

<div class="card tall">
<img src="https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=900&q=80">
<div class="overlay"></div>
<div class="text center">Waves of Sand,<br />Endless Wonder</div>
<div class="text bottom">Wind shapes dunes into calm beauty</div>
</div>

<div class="card small">
<img src="https://images.unsplash.com/photo-1509316785289-025f5b846b35?auto=format&fit=crop&w=900&q=80">
<div class="overlay"></div>
<div class="text bottom">Life adapts in the desert</div>
</div>

<div class="card menu">
<ul>
<li>Dunes</li>
<li>Sunlight</li>
<li>Silence</li>
<li>Oases</li>
</ul>
</div>

<div class="card cta">Feel the Warmth. Hear the Silence.</div>

</div>
</body>
</html>
